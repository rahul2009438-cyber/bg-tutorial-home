    <!-- Automatic Hard Cache Purge & Service Worker Uninstaller -->
    <script>
      (function() {
        var PURGE_KEY = 'bg_cache_purge_2026_11_02_v9';
        try {
          // 1. Unregister all existing service workers immediately
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          // 2. Clear all browser cache storage
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var i = 0; i < keys.length; i++) {
                caches.delete(keys[i]);
              }
            });
          }
          // 3. One-time clean refresh for all clients to ensure fresh assets
          if (localStorage.getItem(PURGE_KEY) !== 'done') {
            localStorage.setItem(PURGE_KEY, 'done');
            setTimeout(function() {
              window.location.reload(true);
            }, 150);
          }
        } catch (e) {
          console.warn('Auto cache purge note:', e);
        }
      })();
    </script>

    <script>
      // Persistent unregister safeguard for legacy service workers
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {

          });
